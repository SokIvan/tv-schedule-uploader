name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # позволяет запускать сборку вручную из вкладки Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Забрать код из репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Собрать EXE
        run: pyinstaller --onefile --windowed --name "TVScheduleUploader" --clean --noconfirm main.py

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: TVScheduleUploader
          path: dist/TVScheduleUploader.exe
